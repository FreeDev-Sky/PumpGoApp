services:
  postgres:
    image: postgres:16-alpine
    container_name: pumpgo-postgres
    environment:
      POSTGRES_USER: pumpgo
      POSTGRES_PASSWORD: pumpgo
      POSTGRES_DB: pumpgo_dev
    ports:
      - '5432:5432'
    volumes:
      - pumpgo_pgdata:/var/lib/postgresql/data

volumes:
  pumpgo_pgdata:
